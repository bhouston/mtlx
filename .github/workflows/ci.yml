name: ci

on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify generated CLI documentation
        run: pnpm docs:cli --check

      - name: Type check
        run: pnpm tsc

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:coverage && pnpm test:workflow

      - name: Bundle size budgets
        run: pnpm size

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Verify production package contents and installation
        run: pnpm pack:release && pnpm check:release

  coverage-badge:
    name: Update coverage badge
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const percent = JSON.parse(fs.readFileSync('coverage/coverage-summary.json')).total.lines.pct;
            const { owner, repo } = context.repo;
            const branch = 'coverage';
            const path = 'coverage.json';
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: context.sha });
            }
            let sha;
            try {
              const result = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              sha = result.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const badge = { schemaVersion: 1, label: 'coverage', message: `${percent}%`, color: percent >= 80 ? 'brightgreen' : 'yellow' };
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, branch, sha,
              message: 'chore: update coverage badge', content: Buffer.from(JSON.stringify(badge)).toString('base64') });

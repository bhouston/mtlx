name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify published packages include dist
        run: |
          for pkg in packages/core packages/viewer packages/cli; do
            (cd "$pkg" && pnpm pack --dry-run) | grep -qx 'dist/index.js' || {
              echo "::error::dist/index.js missing from the packed tarball for $pkg; the publish step would ship a broken package."
              exit 1
            }
          done
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm test
      - name: Verify generated CLI documentation
        run: pnpm docs:cli --check
      - name: Verify generated OpenCLI document
        run: pnpm docs:opencli --check
      - name: Validate OpenCLI document
        uses: bhouston/clidoc-action@v1
        with:
          files: packages/cli/opencli.json
          specification: bcdxn
          format: json
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit found vulnerabilities or could not reach the registry. Review the audit step.'

  contribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate linked issue
        run: node scripts/check-pr.mjs
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Lint feature commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

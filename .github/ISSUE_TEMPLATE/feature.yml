name: Feature or improvement
description: Propose a scoped change with verifiable acceptance criteria
title: 'feat: '
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Compatibility, scope, or implementation constraints
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and how to verify them.
    validations:
      required: true

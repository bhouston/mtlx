packages:
  - packages/*
allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
minimumReleaseAgeExclude:
  - hdrify
  - tanstack-router-ga4
  - '@clidoc/core'
  - '@clidoc/yargs'
  - humanize-units
  - vitest-command-line
  - yargs-file-commands
  - '@vitest/coverage-v8'
  - '@vitest/mocker'
  - '@vitest/spy'
  - vitest
# One vite for the whole workspace: when the website's plugins resolved a newer vite than its
# `vite` binary, TanStack Start's dev SSR handler never registered and every route returned 404.
overrides:
  vite: 8.2.2
